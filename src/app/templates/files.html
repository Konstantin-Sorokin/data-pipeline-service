{% extends "base.html" %}


{% block title %}
Файлы
{% endblock %}


{% block content %}


<h1>
    Скачанные файлы
</h1>


<div class="actions">


    <label class="select-control">

        <input
                type="checkbox"
                id="select-all"
        >

        <span>
            Выбрать все файлы
        </span>

    </label>


    <button id="calculate">
        Произвести расчёты
    </button>


</div>


<table class="files-table">


    <thead>

    <tr>


        <th class="checkbox-column">

            <input
                    type="checkbox"
                    id="select-page-checkbox"
            >

        </th>


        <th>
            Имя файла
        </th>


        <th>
            Время скачивания
        </th>


        <th>
            0
        </th>

        <th>
            1
        </th>

        <th>
            2
        </th>

        <th>
            3
        </th>

        <th>
            4
        </th>

        <th>
            5
        </th>

        <th>
            6
        </th>

        <th>
            7
        </th>

        <th>
            8
        </th>

        <th>
            9
        </th>


    </tr>

    </thead>


    <tbody id="files-table">


    </tbody>


</table>


<div
        id="pagination"
        class="pagination"
>

</div>


<section class="statistics-section">


    <h2>
        Общая статистика
    </h2>


    <div
            id="statistics"
            class="statistics"
    >

    </div>


</section>


<script src="/static/js/files.js"></script>


{% endblock %}
