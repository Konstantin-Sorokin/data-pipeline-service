services:
  app:
    build: .
    container_name: app
    command: ./scripts/start-api.sh
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - data_pipeline


  worker:
    build: .
    container_name: worker
    command: ./scripts/start-worker.sh
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis
    networks:
      - data_pipeline

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - data_pipeline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - data_pipeline
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "85:80"
    networks:
      - data_pipeline
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/app/static:/app/src/app/static:ro
    depends_on:
      - app



networks:
  data_pipeline:

volumes:
  postgres_data:
  redis_data:
